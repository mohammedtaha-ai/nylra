name: desktop-main-presentation
version: 1
status: current
source: apps/desktop/src/app
responsibility: Compose the local account shell, sessions and requests while keeping native account state distinct.
public_api:
  Shell: Show account identity only from a freshly validated native View; mount sessions and requests from sidecar state; provide login, cancellation, session checks and explicit surrender actions.
obligations:
  - rule: Main remains usable without character artwork or backend access.
    tested_by: 'integration: apps/desktop/tests/windows-shell.ps1'
    note: Current native screenshot and Tab/Space hide action; full screen-reader/RTL testing is missing.
gaps:
  - at: Shell
    gap: Browser UI acceptance remains limited by Firefox trust and automation availability; renderer and full AYLUL acceptance remain separate.
