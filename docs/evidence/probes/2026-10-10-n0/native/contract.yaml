name: non-product-n0-windows-probe
version: 1
status: current
source: docs/evidence/probes/2026-10-10-n0/native
responsibility: >
  Synthetic Windows capability and raster measurements only. No product domain,
  cloud connection, account content or Shadows operations are implemented.
public_api:
  main: Constructs synthetic windows and plugins; polls a probe-owned control file.
  metrics: Appends window-labelled JSON metrics to the path selected by N0_LOG.
  setMode: Starts or cancels synthetic frame/state work for the selected mode.
  setSurfaceVisible: Applies explicit native visibility to rendering work.
  setRenderer: Selects canvas or CSS raster instrumentation.
  show_noactivate: Shows a Windows probe HWND with SW_SHOWNOACTIVATE and resumes explicit renderer visibility.
external_types:
  - tauri::WebviewWindow
  - tauri::tray::TrayIcon
  - serde_json::Value
obligations:
  - rule: Hidden presentation must stop ongoing synthetic frame work.
    tested_by: 'animation.test.cjs: native hide cancels frame work and show resumes it'
    note: >
      Recorded native trials and steady-state JSONL samples exist in the dated
      report; drivers do not assert a precise transition-latency bound.
  - rule: Ordinary attention must preserve foreground focus.
    tested_by: 'integration: release-focus.ps1'
    note: Current-device paired cycles only; default show/hide still exposes the historical failure.
  - rule: Canvas draws must not follow every 144Hz callback.
    tested_by: 'animation.test.cjs: active drawing is capped on a 144Hz display'
gaps:
  - at: main
    gap: >
      The restricted rectangular cursor test polls every 100ms. Rapid crossings,
      alpha-shaped bounds and complete device lifecycle are not established.
  - at: setMode
    gap: Synthetic reduced mode exists, but real OS preference changes are not handled or verified.
  - at: tick
    gap: Timeout plus display scheduling caps actual work below 30fps; measured p95 fails the original 20ms provisional cadence budget.
open_questions:
  - Actual tray Left Down/Up were observed in the follow-up, but menu-item activation remains unverified.
  - Final renderer, asset authoring and focus-preserving lifecycle remain owner-spec gates.
